name: Android 构建 APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    name: 构建 APK
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: 查看已安装的 Android SDK
        run: |
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls $ANDROID_SDK_ROOT/platforms/ || true
          ls $ANDROID_SDK_ROOT/build-tools/ || true

      - name: 安装 SDK 34（如需要）
        run: |
          if [ ! -d "$ANDROID_SDK_ROOT/platforms/android-34" ]; then
            echo "正在安装 android-34..."
            $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0" || true
          else
            echo "android-34 已安装"
          fi

      - name: 下载 Gradle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.2-bin.zip
          unzip -q gradle-8.2-bin.zip

      - name: 构建 Debug APK
        continue-on-error: true
        run: gradle-8.2/bin/gradle assembleDebug --no-daemon --stacktrace --info 2>&1 | tail -100

      - name: 上传 APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stickerpal-debug
          path: app/build/outputs/apk/debug/app-debug.apk
