name: Android 构建 APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

env:
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

jobs:
  build:
    name: 构建 APK
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: 安装 Android SDK 34
        run: $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: 下载 Gradle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.2-bin.zip
          unzip -q gradle-8.2-bin.zip

      - name: 构建 Debug APK
        run: |
          gradle-8.2/bin/gradle assembleDebug --no-daemon --stacktrace

      - name: 运行单元测试
        run: gradle-8.2/bin/gradle test --no-daemon --stacktrace

      - name: 上传 APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stickerpal-debug
          path: app/build/outputs/apk/debug/app-debug.apk
