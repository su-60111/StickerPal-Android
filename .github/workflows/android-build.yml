name: Android 构建 APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

env:
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

jobs:
  build:
    name: 构建 APK
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: 安装 SDK 34
        run: |
          if [ ! -d "$ANDROID_SDK_ROOT/platforms/android-34" ]; then
            $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0"
          fi

      - name: 下载 Gradle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.2-bin.zip
          unzip -q gradle-8.2-bin.zip

      - name: 构建 Debug APK
        id: build
        run: gradle-8.2/bin/gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log

      - name: 显示构建结果
        if: always()
        run: |
          echo "=== 构建目录 ==="
          find app/build/outputs -name "*.apk" 2>/dev/null || echo "未找到 APK 文件"
          echo "=== 错误信息 ==="
          grep -A 5 "FAILURE\|error\|Error" build.log | tail -30 || echo "无错误"

      - name: 上传 APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: stickerpal-debug
          path: app/build/outputs/apk/debug/app-debug.apk
